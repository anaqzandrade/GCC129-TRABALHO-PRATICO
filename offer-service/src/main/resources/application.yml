# Toda configuração vem de variáveis de ambiente (padrão de nomes do redistribution/logistics).
# Os valores depois de ":" são apenas para rodar localmente sem Docker.
server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful

spring:
  application:
    name: offer-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:offer_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    # O schema pertence ao Flyway (src/main/resources/db/migration); o Hibernate não altera tabelas.
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    # O RabbitMQ confirma cada mensagem recebida; só depois disso a linha do outbox vira PUBLISHED.
    publisher-confirm-type: simple
  jackson:
    # Contrato: campos desconhecidos na entrada retornam 400.
    deserialization:
      fail-on-unknown-properties: true
    # Contrato: campos opcionais ausentes são omitidos da resposta.
    default-property-inclusion: non_null
    # 30.000 sai como 30, e não como 3E+1.
    generator:
      write-bigdecimal-as-plain: true

ravita:
  # Fuso usado para escrever datas nas respostas (a persistência é sempre em UTC).
  time-zone: ${RAVITA_TIME_ZONE:America/Sao_Paulo}
  services:
    organization-url: ${ORGANIZATION_SERVICE_URL:http://localhost:8081}
    organization-timeout: ${ORGANIZATION_SERVICE_TIMEOUT:2s}
  expiration:
    # Intervalo (ms) do job que marca ofertas vencidas como EXPIRED.
    interval-ms: ${OFFER_EXPIRATION_INTERVAL_MS:60000}
  rabbitmq:
    exchange: ${RABBITMQ_EXCHANGE:ravita.events}
  outbox:
    # A cada intervalo o OutboxPublisher publica até batch-size eventos PENDING.
    interval-ms: ${OUTBOX_INTERVAL_MS:1000}
    batch-size: 50
    # Erros que não são de conexão; depois disso a linha fica FAILED.
    max-attempts: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    # O offer continua atendendo com o RabbitMQ fora do ar: os eventos esperam no outbox.
    # Por isso o RabbitMQ não entra no health (nem no healthcheck do compose) deste serviço.
    rabbit:
      enabled: false

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"
