# Offer Service + banco próprio (Database per Service).
#
# Rodar sozinho, de dentro de offer-service/:   docker compose up --build
# No docker-compose.yml da raiz, copie os serviços offer-db e offer-service, o volume e as redes
# (veja a seção "Compose da raiz" no README). Lá, tire o "ports" do offer-service: só o gateway
# deve ser publicado, e sem porta fixa dá para escalar com --scale offer-service=3.
name: ravita-offer

services:
  offer-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: offer_db
      POSTGRES_USER: ${OFFER_DB_USER:-offer}
      POSTGRES_PASSWORD: ${OFFER_DB_PASSWORD:-offer}
    volumes:
      # os dados sobrevivem a "docker compose down"; só "down -v" apaga
      - offer-db-data:/var/lib/postgresql/data
    networks:
      - offer-data
    # sem "ports": o banco não é acessível de fora da rede offer-data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  offer-service:
    build:
      context: .
    image: ravita/offer-service:0.0.1
    environment:
      SERVER_PORT: 8082
      DB_HOST: offer-db
      DB_PORT: 5432
      DB_NAME: offer_db
      DB_USER: ${OFFER_DB_USER:-offer}
      DB_PASSWORD: ${OFFER_DB_PASSWORD:-offer}
      ORGANIZATION_SERVICE_URL: ${ORGANIZATION_SERVICE_URL:-http://organization-service:8081}
    depends_on:
      offer-db:
        condition: service_healthy
    networks:
      - offer-data   # fala com o próprio banco
      - services     # fala com os outros serviços (organization, redistribution) e é chamado por eles
    ports:
      - "${OFFER_HOST_PORT:-8082}:8082"
    healthcheck:
      # /actuator/health inclui o banco: só fica "healthy" se o PostgreSQL estiver respondendo
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 40s
      retries: 5
    restart: unless-stopped

networks:
  # internal: o banco não tem saída nem entrada fora desta rede
  offer-data:
    internal: true
  services:

volumes:
  offer-db-data:
