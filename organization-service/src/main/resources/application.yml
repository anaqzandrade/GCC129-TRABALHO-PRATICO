server:
  port: ${SERVER_PORT:8081}
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/organization_db}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

# /actuator/health para o healthcheck do docker-compose. O health inclui o banco
# e, nos serviços com mensageria, o RabbitMQ.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
