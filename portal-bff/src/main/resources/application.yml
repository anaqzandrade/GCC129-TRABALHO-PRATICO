# Toda configuração vem de variáveis de ambiente; os valores depois de ":" servem para rodar sem Docker.
server:
  port: ${SERVER_PORT:8091}
  shutdown: graceful

spring:
  application:
    name: portal-bff

ravita:
  services:
    offer-url: ${OFFER_SERVICE_URL:http://localhost:8082}
    organization-url: ${ORGANIZATION_SERVICE_URL:http://localhost:8081}
    matching-url: ${MATCHING_SERVICE_URL:http://localhost:8080}
    redistribution-url: ${REDISTRIBUTION_SERVICE_URL:http://localhost:8083}
    logistics-url: ${LOGISTICS_SERVICE_URL:http://localhost:8084}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"
