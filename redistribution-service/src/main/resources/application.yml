server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: redistribution-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:redistribution_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

ravita:
  services:
    offer-url: ${OFFER_SERVICE_URL:http://localhost:8081}
    logistics-url: ${LOGISTICS_SERVICE_URL:http://localhost:8084}
  rabbitmq:
    exchange: ${RABBITMQ_EXCHANGE:ravita.events}