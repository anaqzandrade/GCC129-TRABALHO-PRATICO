# O gateway encaminha /app/** para cá sem o prefixo /app (StripPrefix=1).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    # redirecionamentos relativos: o nginx não conhece o endereço público do gateway
    absolute_redirect off;

    location = /healthz { access_log off; default_type text/plain; return 200 "ok"; }

    # os redirecionamentos levam o prefixo /app, porque o navegador está no gateway
    location = /       { return 302 /app/portal/; }
    location = /portal { return 301 /app/portal/; }
    location = /admin  { return 301 /app/admin/; }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}
